<script>
document.getElementById("copyBtn").addEventListener("click", () => {
  
  const buttonCode = `<a href="https://dipa.lol">
  <img
    alt="dipa's site"
    src="https://dipa-cotton.github.io/personalsite/images/dipa's%20button.png"
    width="88"
    height="31"
    />`;

  navigator.clipboard.writeText(buttonCode)
    .then(() => {
      const msg = document.getElementById("copiedMessage");
      msg.style.opacity = "1";

      setTimeout(() => {
        msg.style.opacity = "0";
      }, 1200);
    });
});
</script>
